<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Cartas de Frutas</title>
<style>
:root{--bg:#f6f1e3;--card:#fffdf6;--ink:#23301f;--mute:#6b7560;--line:#d9d2b8;--accent:#2f6b3a;--accent-ink:#fff;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a13;--card:#1d251c;--ink:#ecefe3;--mute:#9aa690;--line:#334030;--accent:#6fbf7c;--accent-ink:#0f1a10;--field:#141a13}}
:root[data-theme="dark"]{--bg:#141a13;--card:#1d251c;--ink:#ecefe3;--mute:#9aa690;--line:#334030;--accent:#6fbf7c;--accent-ink:#0f1a10;--field:#141a13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
button,.btn{font:inherit;font-weight:bold;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-block;text-align:center}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
input[type=file]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
label{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 3px}
input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
details{margin-top:10px;font-size:.9rem}
summary{cursor:pointer;color:var(--mute)}
input[type=range]{width:100%}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:10px}
.hint{font-size:.8rem;color:var(--mute);margin-top:4px;min-height:1.1em}
.hint a{color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--mute);font:inherit;font-weight:bold;cursor:pointer;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:none}
.panel.active{display:block}
#fontes-area{width:100%;min-height:220px;font:inherit;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);resize:vertical;line-height:1.5}
.fontes-help{font-size:.85rem;color:var(--mute);margin:0 0 12px}

</style>
</head>
<body>
<main>
  <h1>Gerador de cartas de frutas</h1>
  <p class="sub">Escolha as fotos, confira o nome de cada fruta e baixe as cartas prontas.</p>
  <div class="bar">
    <label class="btn" for="fotos" style="margin:0;color:var(--accent-ink)">＋ Escolher fotos</label>
    <input id="fotos" type="file" accept="image/*" multiple>
    <button id="zip" class="alt" disabled>Baixar todas (PDF)</button>
    <button id="limpar" class="alt" disabled>Limpar tudo</button>
  </div>
  <div id="vazio" class="empty">Nenhuma foto ainda.<br>Toque em “Escolher fotos” e selecione as frutas (pode escolher várias de uma vez).</div>
  <div id="lista" class="grid"></div>
</main>
<div id="toast" class="toast"></div>
<script>
const FRAME_SRC="moldura.jpg";
const BOX_NOME=[175,70,830,205], BOX_CIENT=[200,1390,805,1515];
const FONT_NOME='bold {s}px Georgia,"Times New Roman",serif', FONT_CIENT='italic {s}px Georgia,"Times New Roman",serif';
const PREVIEW=0.45;
let frame=null, maskCanvas=null, bbox=null, items=[], layer=document.createElement("canvas");
const $=id=>document.getElementById(id);

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}

function boxBlur(a,W,H){ // média 3x3 separável
  const t=new Float32Array(a.length), o=new Uint8Array(a.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;t[i]=((x>0?a[i-1]:a[i])+a[i]+(x<W-1?a[i+1]:a[i]))/3}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;o[i]=((y>0?t[i-W]:t[i])+t[i]+(y<H-1?t[i+W]:t[i]))/3}
  return o}
function dilate(a,W,H,r){
  const t=new Uint8Array(a.length), o=new Uint8Array(a.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx>=0&&xx<W&&a[y*W+xx]){v=255;break}}t[y*W+x]=v}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy>=0&&yy<H&&t[yy*W+x]){v=255;break}}o[y*W+x]=v}
  return o}

function buildMask(img){
  const W=img.naturalWidth,H=img.naturalHeight, c=document.createElement("canvas");
  c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,W,H).data, light=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)light[i]=(d[i*4]>238&&d[i*4+1]>238&&d[i*4+2]>238)?1:0;
  const seen=new Uint8Array(W*H), st=new Int32Array(W*H);let sp=0;
  const s0=Math.floor(H/2)*W+Math.floor(W/2);
  if(!light[s0])throw new Error("centro da moldura não é branco");
  st[sp++]=s0;seen[s0]=1;
  while(sp){const i=st[--sp],px=i%W,py=(i-px)/W;
    if(px>0&&light[i-1]&&!seen[i-1]){seen[i-1]=1;st[sp++]=i-1}
    if(px<W-1&&light[i+1]&&!seen[i+1]){seen[i+1]=1;st[sp++]=i+1}
    if(py>0&&light[i-W]&&!seen[i-W]){seen[i-W]=1;st[sp++]=i-W}
    if(py<H-1&&light[i+W]&&!seen[i+W]){seen[i+W]=1;st[sp++]=i+W}}
  let m=dilate(seen,W,H,3);
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++)if(m[y*W+xx]){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
  bbox=[x0,y0,x1+1,y1+1];
  m=boxBlur(m,W,H);
  const mc=document.createElement("canvas");mc.width=W;mc.height=H;
  const mx=mc.getContext("2d"),id=mx.createImageData(W,H);
  for(let i=0;i<W*H;i++)id.data[i*4+3]=m[i];
  mx.putImageData(id,0,0);maskCanvas=mc}

function fitText(ctx,txt,tpl,box,max,margin){
  const maxW=(box[2]-box[0])-2*margin;let s=max;
  for(;s>14;s-=2){ctx.font=tpl.replace("{s}",s);if(ctx.measureText(txt).width<=maxW)break}
  return s}

function draw(c,it,scale){
  const W=frame.naturalWidth,H=frame.naturalHeight;
  c.width=Math.round(W*scale);c.height=Math.round(H*scale);
  const ctx=c.getContext("2d");ctx.setTransform(scale,0,0,scale,0,0);ctx.drawImage(frame,0,0);
  const [bx0,by0,bx1,by1]=bbox,aw=bx1-bx0,ah=by1-by0;
  layer.width=c.width;layer.height=c.height;
  const lx=layer.getContext("2d");lx.setTransform(scale,0,0,scale,0,0);
  const s=Math.max(aw/it.img.naturalWidth,ah/it.img.naturalHeight)*it.zoom;
  const dw=it.img.naturalWidth*s,dh=it.img.naturalHeight*s;
  lx.drawImage(it.img,bx0+(aw-dw)*it.px,by0+(ah-dh)*it.py,dw,dh);
  lx.globalCompositeOperation="destination-in";lx.drawImage(maskCanvas,0,0);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(layer,0,0);ctx.setTransform(scale,0,0,scale,0,0);
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  const cx=(BOX_NOME[0]+BOX_NOME[2])/2;
  let sz=fitText(ctx,it.nome||" ",FONT_NOME,BOX_NOME,130,30);
  ctx.fillStyle="#faeec8";ctx.fillText(it.nome,cx,(BOX_NOME[1]+BOX_NOME[3])/2+sz*0.33);
  sz=fitText(ctx,it.cient||" ",FONT_CIENT,BOX_CIENT,70,30);
  ctx.fillStyle="#2a3a22";ctx.fillText(it.cient,(BOX_CIENT[0]+BOX_CIENT[2])/2,(BOX_CIENT[1]+BOX_CIENT[3])/2+sz*0.33)}

function redraw(it){cancelAnimationFrame(it.raf);it.raf=requestAnimationFrame(()=>draw(it.canvas,it,PREVIEW))}

const FRUTAS_TXT=`Abacate|Persea americana|

Limão-taiti|Citrus × latifolia|
Maçã|Malus domestica|
Macadâmia|Macadamia integrifolia|
Mamão|Carica papaya|papaya
Manga|Mangifera indica|
Mangaba|Hancornia speciosa|
Mangostão|Garcinia mangostana|
Maracujá|Passiflora edulis|maracuja amarelo
Melancia|Citrullus lanatus|
Melão|Cucumis melo|
Mexerica|Citrus reticulata|tangerina,bergamota,ponkan
Mirtilo|Vaccinium corymbosum|blueberry
Morango|Fragaria × ananassa|
Murici|Byrsonima crassifolia|
Nectarina|Prunus persica var. nucipersica|

Uvaia|Eugenia pyriformis|`;
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[_\-]+/g," ").replace(/\(\d+\)/g,"").replace(/\d+$/,"").replace(/\s+/g," ").trim();
const MAPA=new Map();
FRUTAS_TXT.trim().split("\n").forEach(l=>{const [n,c,a]=l.split("|"),e={nome:n,cient:c};MAPA.set(norm(n),e);(a||"").split(",").filter(Boolean).forEach(x=>MAPA.set(norm(x),e))});
const achar=t=>MAPA.get(norm(t))||null;
{const dl=document.createElement("datalist");dl.id="dl";[...new Set([...MAPA.values()].map(e=>e.nome))].sort((a,b)=>a.localeCompare(b,"pt")).forEach(n=>{const o=document.createElement("option");o.value=n;dl.appendChild(o)});document.body.appendChild(dl)}
function dica(it){
  const h=it.el.querySelector(".hint");
  if(!it.cient){h.innerHTML="Não achei na lista. ";const a=document.createElement("a");a.target="_blank";a.rel="noopener";a.textContent="Buscar no Google";a.href="https://www.google.com/search?q="+encodeURIComponent((it.nome||"")+" nome científico");h.appendChild(a)}
  else h.textContent=it.auto?"Preenchido automaticamente. Confira antes de baixar.":""}
function nomeDoArquivo(n){
  let s=n.replace(/\.[^.]+$/,"").replace(/[_\-]+/g," ").trim();
  return s?s.charAt(0).toUpperCase()+s.slice(1):""}

function slug(s){return (s||"carta").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"carta"}

function render(){
  $("vazio").style.display=items.length?"none":"block";
  $("zip").disabled=!items.length;$("limpar").disabled=!items.length}

function addItem(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const base=nomeDoArquivo(file.name),hit=achar(base);
    const it={img,url,nome:hit?hit.nome:base,cient:hit?hit.cient:"",fonte:"",auto:!!hit,zoom:1,px:.5,py:.5};
    const el=document.createElement("article");
    el.innerHTML=`<canvas></canvas>
      <label>Nome da fruta</label><input type="text" class="n" list="dl" autocomplete="off">
      <label>Nome científico</label><input type="text" class="c" autocomplete="off" placeholder="Ex.: Crescentia cujete L.">
      <label>Fonte da foto</label><input type="text" class="f" autocomplete="off" placeholder="Ex.: Unsplash / João Silva – licença Unsplash">
      <div class="hint"></div>
      <details><summary>Ajustar foto</summary>
        <label>Zoom</label><input type="range" class="z" min="1" max="3" step="0.02" value="1">
        <label>Posição horizontal</label><input type="range" class="x" min="0" max="1" step="0.01" value="0.5">
        <label>Posição vertical</label><input type="range" class="y" min="0" max="1" step="0.01" value="0.5">
      </details>
      <div class="row"><button class="b">Baixar</button><button class="alt r">Remover</button></div>`;
    it.el=el;it.canvas=el.querySelector("canvas");
    const n=el.querySelector(".n"),c=el.querySelector(".c"),f=el.querySelector(".f");n.value=it.nome;c.value=it.cient;f.value=it.fonte||"";dica(it);
    n.oninput=()=>{it.nome=n.value;const h=achar(n.value);
      if(h&&(it.auto||!it.cient)){it.cient=h.cient;c.value=h.cient;it.auto=true}
      else if(!h&&it.auto){it.cient="";c.value="";it.auto=false}
      dica(it);redraw(it)};
    c.oninput=()=>{it.cient=c.value;it.auto=false;dica(it);redraw(it)};
    f.oninput=()=>{it.fonte=f.value};
    el.querySelector(".z").oninput=e=>{it.zoom=+e.target.value;redraw(it)};
    el.querySelector(".x").oninput=e=>{it.px=+e.target.value;redraw(it)};
    el.querySelector(".y").oninput=e=>{it.py=+e.target.value;redraw(it)};
    el.querySelector(".b").onclick=()=>baixar(it);
    el.querySelector(".r").onclick=()=>{items=items.filter(x=>x!==it);el.remove();URL.revokeObjectURL(url);render()};
    $("lista").appendChild(el);items.push(it);render();redraw(it)};
  img.onerror=()=>toast("Não consegui abrir: "+file.name);
  img.src=url}

function cartaBlob(it){
  const c=document.createElement("canvas");draw(c,it,1);
  return new Promise(res=>c.toBlob(res,"image/png"))}

async function salvar(filename,blob){
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename,data:blob});return true}catch(e){if(e&&e.code==="declined")return false}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}

async function baixar(it){
  const b=await cartaBlob(it);
  if(await salvar(slug(it.nome)+".png",b))toast("Carta pronta")}

async function pdfBlob(){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = d => {
    const u = typeof d === "string" ? enc.encode(d) : d;
    parts.push(u);
    len += u.length;
  };

  const W = frame.naturalWidth, H = frame.naturalHeight;
  const pw = (W * 72 / 300).toFixed(2);
  const ph = (H * 72 / 300).toFixed(2);

  // Coleta fontes preenchidas
  const linhasFontes = items
    .map(it => {
      const f = (it.fonte || "").trim();
      if (!f) return null;
      const nome = (it.nome || "Sem nome").trim();
      return nome + " — " + f;
    })
    .filter(Boolean);
  const temFontes = linhasFontes.length > 0;
  const nCartas = items.length;
  const nPaginas = nCartas + (temFontes ? 1 : 0);

  let fontesJpg = null;
  if (temFontes) {
    const c = document.createElement("canvas");
    c.width = W;
    c.height = H;
    const ctx = c.getContext("2d");

    ctx.fillStyle = "#f6f1e3";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#23301f";
    ctx.font = "bold 64px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillText("Fontes / Créditos", W / 2, 130);

    ctx.font = "32px Georgia, serif";
    ctx.textAlign = "left";
    const maxW = W - 140;
    const lineH = 48;
    let y = 220;
    const linhas = [];

    linhasFontes.forEach(par => {
      const palavras = par.split(" ");
      let linha = "";
      palavras.forEach(p => {
        const teste = linha ? linha + " " + p : p;
        if (ctx.measureText(teste).width > maxW) {
          if (linha) linhas.push(linha);
          linha = p;
        } else {
          linha = teste;
        }
      });
      if (linha) linhas.push(linha);
      linhas.push(""); // espaço entre itens
    });

    linhas.forEach(l => {
      if (y > H - 90) return;
      ctx.fillText(l, 70, y);
      y += lineH;
    });

    const jb = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
    fontesJpg = new Uint8Array(await jb.arrayBuffer());
  }

  const kids = Array.from({length: nPaginas}, (_, i) => `${3 + 3 * i} 0 R`).join(" ");
  push("%PDF-1.4\n");
  offs[1] = len; push("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  offs[2] = len; push(`2 0 obj\n<</Type/Pages/Kids[${kids}]/Count ${nPaginas}>>\nendobj\n`);

  for (let i = 0; i < nCartas; i++) {
    const c = document.createElement("canvas");
    draw(c, items[i], 1);
    const jb = await new Promise(r => c.toBlob(r, "image/jpeg", 0.95));
    const jpg = new Uint8Array(await jb.arrayBuffer());
    const p = 3 + 3 * i;
    const ct = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;

    offs[p] = len;
    push(`${p} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>\nendobj\n`);
    offs[p+1] = len;
    push(`${p+1} 0 obj\n<</Length ${ct.length}>>\nstream\n${ct}\nendstream\nendobj\n`);
    offs[p+2] = len;
    push(`${p+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${W}/Height ${H}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);
    push(jpg);
    push("\nendstream\nendobj\n");
  }

  if (temFontes) {
    const i = nCartas;
    const p = 3 + 3 * i;
    const ct = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;

    offs[p] = len;
    push(`${p} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>\nendobj\n`);
    offs[p+1] = len;
    push(`${p+1} 0 obj\n<</Length ${ct.length}>>\nstream\n${ct}\nendstream\nendobj\n`);
    offs[p+2] = len;
    push(`${p+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${W}/Height ${H}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${fontesJpg.length}>>\nstream\n`);
    push(fontesJpg);
    push("\nendstream\nendobj\n");
  }

  const total = 3 + 3 * nPaginas;
  const xr = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  push(x + `trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);

  return new Blob(parts, {type: "application/pdf"});
}


$("zip").onclick=async()=>{
  toast("Gerando PDF…");
  const blob=await pdfBlob();
  if(await salvar("cartas-frutas.pdf",blob))toast("PDF pronto")};


$("limpar").onclick=()=>{items.forEach(i=>URL.revokeObjectURL(i.url));items=[];$("lista").innerHTML="";render()};
$("fotos").onchange=e=>{
  if(!frame||!maskCanvas)return toast("Aguarde, carregando a moldura…");
  [...e.target.files].forEach(addItem);e.target.value=""};

const f=new Image();
f.onload=()=>{try{frame=f;buildMask(f);toast("Moldura carregada")}catch(err){console.error(err);toast("Erro na moldura: "+err.message)}};f.onerror=()=>toast("Não foi possível carregar moldura.jpg");
f.src=FRAME_SRC;
render();
</script>
